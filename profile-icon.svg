<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#5b21b6"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <clipPath id="c"><circle cx="100" cy="100" r="74"/></clipPath>
    <filter id="s" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- soft gradient ring -->
  <circle cx="100" cy="100" r="84" fill="none" stroke="url(#g)" stroke-width="8" opacity="0.95" stroke-linecap="round"/>
  <!-- inner backdrop -->
  <circle cx="100" cy="100" r="78" fill="rgba(255,255,255,0.02)" />

  <!-- user image clipped to circle -->
  <g clip-path="url(#c)" filter="url(#s)">
    <image href="assets/profile.jpg" x="26" y="26" width="148" height="148" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <!-- subtle outer glow -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="2"/>
</svg>